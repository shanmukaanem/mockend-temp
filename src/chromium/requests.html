  <header class="request-toolbar">
    <div class="request-brand"><span class="brand-mark" aria-hidden="true"></span><h1>Mockend</h1></div>
    <div class="capture-controls">
      <span id="recording-state" role="status" class="sr-only">Starting recording…</span>
      <button class="secondary" id="record-toggle" type="button" aria-describedby="recording-state" disabled>Start recording</button>
      <span id="capture-live" role="status" class="sr-only">Mocking off</span>
      <button id="toggle" class="secondary" type="button" aria-describedby="capture-live" disabled>Start mocking</button>
    </div>
    <label class="environment-picker"><span class="sr-only">Env</span><select id="mock-environment" aria-label="Env"><button type="button"><selectedcontent></selectedcontent></button><option value="">No Env</option></select></label>

    <button id="theme-toggle" type="button" aria-label="Toggle theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13A8 8 0 1 1 11 4a6 6 0 0 0 9 9Z"/></svg></button>
    <button id="open-tab" class="secondary toolbar-icon" type="button" aria-label="Open Mockend in new tab" title="Open Mockend in new tab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4h7v7m0-7-9 9m-2-8H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></svg></button>
  </header>
  <section id="requests-view" aria-labelledby="capture-title">
    <div class="request-heading">
      <div><h2 id="capture-title">Requests</h2><span class="section-count" id="request-count" aria-live="polite"></span></div>
      <div class="request-heading-actions">
      <div id="request-url-selectors" class="url-selectors"><button class="secondary base-url-toggle" id="base-url-toggle" type="button" popovertarget="base-url-menu" data-tooltip="Limit requests to the selected base URLs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3V5Zm0 5h18M7 7h1m3 0h1"/></svg><span class="scope-label control-label">Base URL</span><small></small></button><div id="base-url-menu" class="base-url-menu" popover aria-label="Base URLs"><div class="base-url-menu-tools"><label data-url="*"><span>Select all</span><input type="checkbox"></label></div><div id="base-url-options"></div></div></div>
      <button class="secondary" id="clear-requests" type="button" disabled>Clear</button>
      <div class="split-actions">
        <button class="secondary toolbar-icon" id="export-postman" type="button" aria-label="Export Collection" title="Export collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h9l5 5v11H5V4Zm9 0v5h5M8 15h8m-3-3 3 3-3 3"/></svg></button>
        <button class="secondary toolbar-icon" id="copy-postman" type="button" aria-label="Copy Collection" title="Copy collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 4H6a2 2 0 0 0-2 2v10"/></svg><span id="copy-postman-label" class="sr-only">Copy</span></button>
      </div>
      </div>
    </div>
    <div class="request-filters">
      <div class="search-control"><label class="request-search"><span class="sr-only">Search requests and responses</span><input id="request-query" type="search" placeholder="Search requests and responses" aria-describedby="request-query-error" autocomplete="off"></label><button class="icon remove-filter search-clear" type="button" aria-label="Clear request search" title="Clear request search" disabled></button></div>
      <button class="secondary" id="regex-toggle" type="button" aria-pressed="false" aria-label="Regex search" title="Regex search">.*</button>
      <button class="secondary" id="url-only-toggle" data-tooltip="Search request URLs only" type="button" aria-pressed="false" aria-label="Search URLs only" title="Search URLs only">URL</button>
      <button class="secondary" id="filter-toggle" type="button" aria-controls="request-filter-tree" aria-expanded="false">Filters<span id="filter-count" hidden></span></button>
      <button class="secondary invert-results" id="invert-results" type="button" aria-pressed="false" data-tooltip="Show excluded records within the selected Base URLs" hidden>Invert Filter Result</button>
      <button class="primary" id="mock-scenario" data-tooltip="Create a flow from the latest captured response for each API" type="button" disabled>Mock Flow</button>
      <div id="request-filter-tree" class="request-filter-tree" role="group" aria-label="Request filters" hidden>
        <div class="filter-panel-tools">
          <div class="search-control"><label><span class="sr-only">Search filter options</span><input id="filter-options-query" type="search" placeholder="Find a filter option" autocomplete="off"></label><button class="icon remove-filter search-clear" type="button" aria-label="Clear filter search" title="Clear filter search" disabled></button></div>
          <label class="filter-select-all"><input id="select-all-filters" type="checkbox" aria-label="Select all filters"><span>Select all</span></label>
        </div>
        <div id="applied-filters" class="applied-filters">
          <div id="filter-chips" role="region" aria-label="Applied filter pills" tabindex="-1"></div>
          <button class="secondary" id="clear-filters" type="button" disabled>Clear filters</button>
        </div>
        <div id="request-facets" class="request-facets"></div>
        <p id="filter-options-empty" hidden>No matching filter options.</p>
      </div>
    </div>
    <p id="request-search-progress" class="sr-only" role="status" hidden>Searching recorded response bodies.</p>
    <p id="request-query-error" class="feedback error" role="status" hidden></p>
    <p id="postman-status" role="status" hidden></p>
    <p id="capture-status" role="status" hidden></p>
    <div class="request-table" tabindex="0" role="region" aria-label="Captured requests table">
      <table>
        <thead><tr><th scope="col" class="request-id-column"><button type="button" data-sort="id">ID<span aria-hidden="true"></span></button></th><th scope="col" class="request-method-column"><button type="button" data-sort="method">Method<span aria-hidden="true"></span></button></th><th scope="col"><button type="button" data-sort="base">Base URL / Path<span aria-hidden="true"></span></button></th><th scope="col"><button type="button" data-sort="endpoint">Endpoint<span aria-hidden="true"></span></button></th><th scope="col" class="request-type-column"><button type="button" data-sort="type">Type<span aria-hidden="true"></span></button></th><th scope="col" class="request-status-column"><button type="button" data-sort="status">Status<span aria-hidden="true"></span></button></th></tr></thead>
        <tbody id="request-rows"></tbody>
        <tbody id="request-empty"><tr><td colspan="6"><p id="request-empty-text" class="table-empty" role="status">Trigger a request or reload the app to capture startup traffic.</p></td></tr></tbody>
      </table>
    </div>
  </section>
  <div id="request-actions" popover aria-label="Request filters"><div id="request-add-filters"></div></div>

  <dialog id="request-details" closedby="any" aria-labelledby="request-details-title">
    <form method="dialog">
      <div class="dialog-head"><div><h2 id="request-details-title">Request details</h2><div class="request-detail-badges"><span id="request-detail-method" class="method-badge mono"></span><span id="request-detail-type" class="type-badge"></span><span id="request-detail-mock" class="type-badge mock-badge" hidden>Mocked</span><span id="request-detail-status" class="request-code mono"></span></div><p id="request-detail-url" class="mono"></p><p id="request-detail-outcome" hidden></p><button id="request-detail-rule" class="mock-rule-link" type="button" hidden></button></div><button class="icon close" type="button" aria-label="Close request details"></button></div>
      <div class="dialog-body">
        <section id="response-detail-section" class="preview-section">
          <h3>Response body</h3>
          <pre id="response-detail-body" class="mono" tabindex="0" aria-label="Response body"></pre>
        </section>
        <section id="request-detail-section" class="preview-section">
          <h3>Request body</h3>
          <pre id="request-detail-body" class="mono" tabindex="0" aria-label="Request body"></pre>
        </section>
      </div>
    </form>
  </dialog>
